[package]
name = "parakletos_quorum"
version = "0.1.0"
description = "Parakletos On-Chain Identity & Quorum Governance Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "parakletos_quorum"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
